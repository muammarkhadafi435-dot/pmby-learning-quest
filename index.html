<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PMBY Learning Quest</title>
<meta name="theme-color" content="#1B2A4A">
<link rel="manifest" href="manifest.json">
<style>
:root{
  --tinta:#1B2A4A; --tapis:#8C1D2C; --emas:#D9A441; --kertas:#FDF7E7;
  --daun:#2E7D5B; --arang:#2A2622; --kabut:#EDE3CE; --redup:#6B6357;
  --r:14px; --pad:18px;
  --f-judul:Georgia,"Noto Serif","Times New Roman",serif;
  --f-isi:system-ui,-apple-system,"Roboto","Segoe UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--f-isi); background:var(--kertas); color:var(--arang);
  font-size:16px; line-height:1.5; overscroll-behavior-y:contain;
}
h1,h2,h3{font-family:var(--f-judul);font-weight:700;line-height:1.2;margin:0 0 .4em}
h1{font-size:1.75rem} h2{font-size:1.3rem} h3{font-size:1.05rem}
p{margin:0 0 .8em}
button{font-family:inherit;font-size:1rem;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:1rem;width:100%;padding:12px;border:2px solid var(--kabut);
  border-radius:10px;background:#fff;color:var(--arang)}
input:focus,select,textarea:focus{outline:3px solid var(--emas);outline-offset:1px}
label{display:block;font-size:.82rem;color:var(--redup);margin:14px 0 5px}
:focus-visible{outline:3px solid var(--emas);outline-offset:2px}

/* motif tapis */
.tapis{height:8px;background:
  repeating-linear-gradient(135deg,var(--emas) 0 6px,transparent 6px 12px),
  repeating-linear-gradient(45deg,var(--tapis) 0 6px,transparent 6px 12px);
  background-color:var(--tinta)}

.wrap{max-width:560px;margin:0 auto;padding:var(--pad);padding-bottom:96px}
.topbar{background:var(--tinta);color:var(--kertas);padding:12px var(--pad);
  display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
.topbar b{font-family:var(--f-judul);font-size:1.05rem;flex:1}
.topbar button{color:var(--emas);font-size:.88rem;padding:6px}

.btn{display:block;width:100%;padding:15px;border-radius:12px;background:var(--tinta);
  color:var(--kertas);font-weight:600;text-align:center;margin-top:12px;min-height:52px}
.btn.emas{background:var(--emas);color:var(--tinta)}
.btn.garis{background:transparent;border:2px solid var(--tinta);color:var(--tinta)}
.btn.merah{background:var(--tapis);color:#fff}
.btn:disabled{opacity:.4}
.btn-baris{display:flex;gap:10px}.btn-baris .btn{margin-top:12px}

.kartu{background:#fff;border:2px solid var(--kabut);border-radius:var(--r);padding:16px;margin:12px 0}
.kartu.pilih{cursor:pointer;display:flex;gap:12px;align-items:center}
.kartu.aktif{border-color:var(--emas);background:#FFFBF0;box-shadow:inset 4px 0 0 var(--emas)}
.ikon{font-size:1.6rem;line-height:1}
.mini{font-size:.8rem;color:var(--redup);margin:0}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{padding:9px 13px;border:2px solid var(--kabut);border-radius:999px;background:#fff;font-size:.88rem}
.chip.on{background:var(--tinta);color:var(--kertas);border-color:var(--tinta)}
.chip.dim.on{background:var(--daun);border-color:var(--daun);color:#fff}

.langkah{display:flex;gap:5px;margin-bottom:16px}
.langkah i{flex:1;height:5px;border-radius:3px;background:var(--kabut)}
.langkah i.on{background:var(--emas)}
.eyebrow{font-size:.78rem;color:var(--tapis);font-weight:700;margin-bottom:2px}

.kode{font-family:ui-monospace,monospace;background:var(--tinta);color:var(--emas);
  padding:14px;border-radius:10px;word-break:break-all;font-size:.82rem;user-select:all}

/* main */
.soal{background:#fff;border:2px solid var(--kabut);border-radius:var(--r);padding:18px;margin-bottom:14px}
.opsi{display:block;width:100%;text-align:left;padding:15px;border:2px solid var(--kabut);
  border-radius:12px;background:#fff;margin-bottom:10px;min-height:54px}
.opsi.on{border-color:var(--tinta);background:#F3F6FC}
.opsi.benar{border-color:var(--daun);background:#EAF6F0}
.opsi.salah{border-color:var(--tapis);background:#FBEDEE}
.tarik{padding:13px;border:2px dashed var(--kabut);border-radius:10px;background:#fff;margin-bottom:8px;
  display:flex;align-items:center;gap:10px}
.tarik.on{border-style:solid;border-color:var(--emas)}
.tarik span{flex:1}
.no{width:26px;height:26px;border-radius:50%;background:var(--tinta);color:var(--kertas);
  display:grid;place-items:center;font-size:.8rem;flex:none}
.bar{height:6px;background:var(--kabut);border-radius:3px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--emas);transition:width .3s}

.umpan{padding:12px;border-radius:10px;margin-top:10px;font-size:.9rem}
.umpan.y{background:#EAF6F0;color:#1B5E3F}.umpan.n{background:#FBEDEE;color:#7A1622}

/* hasil */
.bintang{font-size:2rem;letter-spacing:6px;text-align:center;margin:6px 0}
.quote{font-family:var(--f-judul);font-size:1.12rem;font-style:italic;text-align:center;
  padding:16px;border-top:2px solid var(--kabut);border-bottom:2px solid var(--kabut);margin:16px 0}
.saran{background:#fff;border-left:5px solid var(--daun);border-radius:0 10px 10px 0;padding:14px;margin:12px 0}
.saran div{margin-bottom:9px;font-size:.92rem}.saran div:last-child{margin:0}
#kanvas{width:100%;border-radius:var(--r);border:2px solid var(--kabut);display:block}

/* papan interaktif */
body.papan{font-size:22px;background:var(--tinta);color:var(--kertas)}
body.papan .wrap{max-width:1600px;padding:26px}
body.papan .kartu{background:rgba(255,255,255,.07);border-color:rgba(217,164,65,.4);color:var(--kertas)}
body.papan h1{font-size:3rem}body.papan h2{font-size:2rem}
body.papan .btn{font-size:1.4rem;padding:26px;min-height:96px;border-radius:18px}
body.papan .opsi{font-size:1.5rem;padding:28px;min-height:96px;background:rgba(255,255,255,.09);
  color:var(--kertas);border-color:rgba(217,164,65,.35)}
body.papan .opsi.on{background:var(--emas);color:var(--tinta)}
body.papan .mini{color:#C9C0AD}
body.papan input,body.papan textarea{font-size:1.3rem}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.tim{padding:20px;border-radius:16px;border:3px solid rgba(217,164,65,.4);text-align:center}
.tim.giliran{border-color:var(--emas);background:rgba(217,164,65,.16)}
.tim b{display:block;font-family:var(--f-judul);font-size:1.4rem}
.tim s{display:block;font-size:2.4rem;text-decoration:none;color:var(--emas);font-weight:700}
.tempel{display:inline-block;background:var(--kertas);color:var(--arang);padding:14px;
  border-radius:6px;margin:6px;max-width:280px;font-size:1rem;transform:rotate(-1.5deg)}

.sembunyi{display:none!important}
.pesan{background:#FFF4D6;border:2px solid var(--emas);border-radius:10px;padding:12px;font-size:.88rem;margin:12px 0}
.kosong{text-align:center;padding:34px 16px;color:var(--redup)}

/* ==== v3 warna & permainan ==== */
:root{--main:#1B2A4A}
.opsi .cap{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;
  background:var(--main);color:#fff;font-size:.85rem;font-weight:700;margin-right:10px;flex:none}
.opsi{display:flex;align-items:center}
.opsi.on{border-color:var(--main);background:color-mix(in srgb,var(--main) 8%,#fff)}
.bar i{background:var(--main)}
.soal{border-top:5px solid var(--main)}
.btn.emas{background:var(--emas)}
.dua{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kisi{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kisi2{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}

/* kartu ingatan */
.kartu-balik{aspect-ratio:3/4;border-radius:12px;border:2px solid var(--kabut);
  background:var(--main);color:#fff;font-size:.78rem;padding:6px;display:grid;place-items:center;
  text-align:center;line-height:1.2;transition:transform .18s}
.kartu-balik .belakang{font-size:1.6rem;opacity:.55}
.kartu-balik.kebuka{background:#fff;color:var(--arang);border-color:var(--main)}
.kartu-balik.cocok{background:#EAF6F0;border-color:var(--daun);color:#1B5E3F}

/* sortir */
.kartu-sortir{background:var(--main);color:#fff;border-radius:14px;padding:26px 16px;text-align:center;
  font-family:var(--f-judul);font-size:1.4rem;margin-bottom:14px;transition:transform .3s,opacity .3s}
.kartu-sortir.lolos{transform:scale(.7) translateY(-30px);opacity:0}
.kartu-sortir.gagal{animation:goyang .4s}
@keyframes goyang{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
.keranjang{padding:16px 8px;border:2px dashed var(--kabut);border-radius:12px;background:#fff;
  font-size:1.5rem;line-height:1.35;min-height:88px}
.keranjang br+*{font-size:.8rem}

/* roda */
.roda-kotak{position:relative;width:180px;height:180px;margin:14px auto 4px}
.roda{width:180px;height:180px;border-radius:50%;position:relative;
  background:conic-gradient(#D9A441 0 60deg,#8C1D2C 60deg 120deg,#2E7D5B 120deg 180deg,
  #2F6FD0 180deg 240deg,#B5307A 240deg 300deg,#D9701F 300deg 360deg);
  border:6px solid var(--tinta)}
.roda span{position:absolute;left:50%;top:50%;font-size:1.4rem;margin:-12px 0 0 -12px}
.jarum{position:absolute;top:-12px;left:50%;margin-left:-11px;font-size:1.5rem;color:var(--tinta)}

/* bos */
.bos{background:var(--main);color:#fff;border-radius:16px;padding:16px;text-align:center;margin-bottom:12px}
.bos-muka{font-size:3rem;line-height:1}
.bos .mini{color:#fff;opacity:.8}
.hp{height:14px;background:rgba(0,0,0,.35);border-radius:7px;overflow:hidden;margin:8px 0 4px}
.hp i{display:block;height:100%;background:linear-gradient(90deg,#E24B4B,#F2A03D);transition:width .4s}

/* petunjuk */
.klu{background:#fff;border-left:5px solid var(--main);border-radius:0 10px 10px 0;
  padding:11px 13px;margin-bottom:8px;font-size:.94rem}
.klu b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;
  background:var(--main);color:#fff;font-size:.75rem;margin-right:8px}

/* sprint */
.jam{font-family:var(--f-judul);font-size:3.2rem;text-align:center;color:var(--main);font-weight:700}
.jam.panas{color:var(--tapis)}

/* susun kata */
.papan-kata{min-height:56px;font-size:1.6rem;letter-spacing:6px;text-align:center;font-weight:700;
  padding:12px;border:2px dashed var(--kabut);border-radius:10px;margin-bottom:12px;color:var(--main)}
.chip.huruf{font-size:1.25rem;min-width:48px;font-weight:700}

/* ruang rahasia */
.gembok-baris{display:flex;justify-content:center;gap:14px;font-size:1.8rem;margin-bottom:10px}
.gembok-baris .kini{transform:scale(1.3)}
.gembok-baris .buka{opacity:.45}

@keyframes jatuh{to{transform:translateY(105vh) rotate(540deg);opacity:.15}}


/* ==== Kemah Belajar ==== */
.dock{position:fixed;bottom:0;left:0;right:0;background:var(--tinta);display:flex;z-index:30;
  padding-bottom:env(safe-area-inset-bottom)}
.dock-b{flex:1;padding:9px 2px 11px;color:#B8AF9B;font-size:.66rem;display:flex;flex-direction:column;
  align-items:center;gap:3px;line-height:1}
.dock-b span{font-size:1.32rem}
.dock-b.on{color:var(--emas)}
.dock-b.on span{transform:translateY(-2px)}
body:has(.dock) .wrap{padding-bottom:104px}

.xp-baris{display:flex;gap:13px;align-items:center;background:#fff;border:2px solid var(--kabut);
  border-radius:var(--r);padding:13px;margin-bottom:12px}
.ava{width:52px;height:52px;border-radius:16px;background:var(--kabut);display:grid;place-items:center;
  font-size:1.8rem;flex:none}
.xp-atas{display:flex;justify-content:space-between;align-items:baseline;font-size:.92rem}
.xp-atas span{font-size:.76rem;color:var(--tapis);font-weight:700}
.xp{height:9px;background:var(--kabut);border-radius:5px;overflow:hidden;margin:5px 0 3px}
.xp i{display:block;height:100%;background:linear-gradient(90deg,var(--emas),#E8C46A);transition:width .5s}
.sapa{background:linear-gradient(140deg,#FFF6DF,#FDF7E7);border:2px solid var(--kabut);
  border-radius:var(--r);padding:16px;margin-bottom:6px}
.sapa h2{margin-bottom:4px}

.lacak{background:#fff;border:2px solid var(--kabut);border-radius:12px;padding:12px;margin-bottom:9px}
.lacak-atas{display:flex;justify-content:space-between;font-size:.92rem;margin-bottom:6px}
.lacak-atas span{font-weight:700}
.lacak-bar{height:8px;background:var(--kabut);border-radius:4px;overflow:hidden}
.lacak-bar i{display:block;height:100%}

.kartu-materi{background:#fff;border:2px solid var(--kabut);border-left:6px solid var(--main);
  border-radius:0 var(--r) var(--r) 0;padding:15px;margin-bottom:11px;display:flex;flex-direction:column;gap:8px}
.kartu-materi>div{display:flex;gap:12px}
.kartu-materi.dibaca{opacity:.72;background:#FBF8F0}
.kartu-materi h3{font-size:1.02rem;margin-bottom:5px}
.kartu-materi p{font-size:.9rem;margin:0}
.nomor{flex:none;width:32px;height:32px;border-radius:11px;background:var(--main);color:#fff;
  display:grid;place-items:center;font-weight:700;font-size:.9rem}

.ubin{border-radius:16px;padding:20px 10px;color:#fff;font-weight:700;font-size:.86rem;
  display:flex;flex-direction:column;align-items:center;gap:7px;line-height:1.25;text-align:center;min-height:112px}
.ubin span{font-size:2.1rem}

.kisi3{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:9px}
.lencana{background:#fff;border:2px solid var(--kabut);border-radius:13px;padding:11px 7px;
  text-align:center;opacity:.38;filter:grayscale(1)}
.lencana.dapat{opacity:1;filter:none;border-color:var(--emas);background:#FFFBF0}
.lencana span{font-size:1.7rem;display:block}
.lencana b{font-size:.74rem;display:block;margin:3px 0 2px;line-height:1.2}
.lencana .mini{font-size:.63rem;line-height:1.2}

.tabel{border:2px solid var(--kabut);border-radius:12px;overflow:hidden;background:#fff;margin-top:9px}
.baris{display:grid;grid-template-columns:1fr auto 52px;gap:9px;padding:9px 11px;
  border-bottom:1px solid var(--kabut);font-size:.85rem;align-items:center}
.baris:last-child{border:none}
.baris.kepala{background:var(--tinta);color:var(--kertas);font-weight:700;font-size:.76rem}
.baris span:last-child{text-align:right}
.baris i{font-style:normal;font-size:.72rem}

/* Lab */
.lab{background:#fff;border:2px solid var(--kabut);border-radius:var(--r);padding:15px;margin-bottom:12px}
.lab-layar{background:linear-gradient(160deg,#F7F2E4,#FFFDF6);border-radius:12px;padding:16px;
  margin-bottom:14px;text-align:center;min-height:150px}
.lab-gambar{display:flex;flex-direction:column;align-items:center;gap:6px;transition:filter .3s}
.mtr{font-size:.85rem;letter-spacing:1px}
.lab-hasil b{font-size:1.15rem;color:var(--main)}
.geser{margin-bottom:12px}
.geser label{margin:0 0 5px;font-size:.86rem;color:var(--arang)}
.geser .nilai{color:var(--main)}
.geser input[type=range]{width:100%;accent-color:var(--main);padding:0;border:none;background:none}
.pcn{display:flex;gap:2px;flex:1;height:26px}
.pcn span{flex:1;border:1.5px solid #bbb;border-radius:3px}
.pcn-baris{display:flex;align-items:center;gap:10px;margin:7px 0}
.pcn-baris b{width:44px;font-family:var(--f-judul);font-size:1.05rem}
.banding{font-size:1.9rem;font-weight:700;color:var(--main);font-family:var(--f-judul)}
.tmb{display:flex;align-items:center;justify-content:center;gap:12px;transition:transform .4s}
.tmb .sisi{background:var(--main);color:#fff;padding:14px 16px;border-radius:11px;
  font-family:var(--f-judul);font-size:1.15rem}
.poros{font-size:1.4rem;color:var(--redup)}
@media print{.dock,.topbar,.btn{display:none!important}}

@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

 <div class="kartu"><b>2. Cara paling cepat (1 menit)</b>
 <p>Menu <b>Kirim paket siap pakai</b> → pilih paket yang cocok dengan materi Anda →
 tombol <b>Salin pesan siap kirim</b> → tempel di grup WA kelas. Selesai.
 Soalnya sudah ada, permainannya sudah jadi.</p></div>

 <div class="kartu"><b>3. Kalau ingin soal buatan sendiri</b>
 <p>Menu <b>Misi Belajar dari Rumah</b> → lima langkah: pilih fase dan mapel, pilih capaian pembelajaran
 (atau tulis materi sendiri), pilih tema, pilih jenis permainan, lalu ketik soalnya.
 Misi buatan sendiri memakai kode panjang — salin seluruhnya, jangan sebagian.</p></div>

 <div class="kartu"><b>4. Bedanya dua mode</b>
 <p><b>Belajar dari Rumah</b> — siswa mengerjakan sendiri di HP, kapan saja. Menguatkan kemandirian.<br><br>
 <b>Papan Interaktif</b> — dikerjakan berkelompok di kelas, Anda yang memimpin, siswa maju menyentuh papan.
 Menguatkan kolaborasi. Siswa tidak perlu bawa HP.</p></div>

 <div class="kartu"><b>5. Yang siswa terima setelah selesai</b>
 <p>Bintang, gelar lucu, satu kalimat penyemangat, tiga baris saran belajar, dan sertifikat mini yang bisa
 disimpan ke galeri atau dijadikan status WA. Siswa dengan nilai rendah tetap dapat sertifikat —
 yang dihargai adalah usaha menyelesaikannya.</p></div>

 <div class="kartu"><b>6. Hal yang sering ditanyakan</b>
 <p><b>Perlu internet?</b> Tidak. Aplikasi ini satu berkas, jalan meski tidak ada sinyal.<br><br>
 <b>Siswa tidak punya aplikasinya?</b> Kirim berkas HTML-nya sekali lewat WA. Simpan, buka dengan browser.<br><br>
 <b>Kenapa hasil siswa belum muncul di sini?</b> Versi ini menyimpan data di HP masing-masing.
 Penyatuan data menyusul di tahap berikutnya.<br><br>
 <b>Lupa PIN?</b> Hubungi admin PMBY.</p></div>

 <div class="pesan"><b>Satu saran pemakaian.</b> Untuk pemakaian pertama di kelas, pakai paket siap pakai dulu.
 Setelah Anda melihat sendiri bagaimana siswa mengerjakannya, membuat soal sendiri akan terasa jauh lebih mudah.</div>`;

function ringkasJawab(t,s){
 if(t==='petunjuk')return 'Jawaban: '+esc(s.o[s.k]);
 if(t==='ingat')return esc(s.a)+' ↔ '+esc(s.b);
 if(t==='sortir')return esc(s.x)+' → '+esc(s.g);
 if(t==='sandi')return 'Kunci: '+esc(s.k);
 if(t==='pg')return 'Jawaban: '+esc(s.o[s.k]);
 if(t==='bs')return 'Jawaban: '+(s.k?'Benar':'Salah');
 if(t==='isi')return 'Jawaban: '+esc(s.k);
 if(t==='susun')return 'Kata: '+esc(s.k);
 if(t==='jodoh')return esc(s.a)+' ↔ '+esc(s.b);
 if(t==='urut')return s.u.length+' langkah';
 return '';
}

function cariMisi(v){
 const t=v.trim();
 const kunci=t.toUpperCase().replace(/\s+/g,"");
 // 1. kode pendek paket, boleh dengan atau tanpa nomor guru
 const [kp,ng]=kunci.split("-");
 const p=PAKET.find(x=>x.kode===kp);
 if(p){
  const g=GURU.find(x=>String(x.i)===ng);
  return Object.assign({},p,{id:p.kode,guru:g?g.i:0,
   guruNama:g?g.n:"Gurumu",sekolah:g?g.s:"",kodePendek:kunci})}
 // 2. misi tersimpan di perangkat ini
 const lokal=(Simpan.get("misi")||[]).find(m=>(m.kodePendek||"").toUpperCase()===kunci||m.id===kunci);
 if(lokal)return lokal;
 // 3. kode panjang
 try{const m=b64d(t);if(m&&m.akt)return m}catch(e){}
 return null;
}

function mainJodoh(){
 const m=S.misi;tajuk.textContent="🔗 Menjodohkan";
 const kiri=m.soal.map((s,i)=>({t:s.a,i})),kanan=acak(m.soal.map((s,i)=>({t:s.b,i})));
 let pilihKiri=null,selesai=0;
 L.innerHTML=`<div class="soal"><h3>Pasangkan yang cocok</h3>
  <p class="mini">Ketuk satu di kiri, lalu pasangannya di kanan.</p></div>`;
 const g=el("div","dua");const kolomA=el("div"),kolomB=el("div");g.append(kolomA,kolomB);L.append(g);
 const tombol=(o,kol,sisi)=>{
  const b=el("button","opsi",esc(o.t));b.style.marginBottom="8px";
  b.onclick=()=>{
   if(sisi==="a"){[...kolomA.children].forEach(x=>x.classList.remove("on"));
    b.classList.add("on");pilihKiri={o,b};return}
   if(!pilihKiri)return;
   const ok=pilihKiri.o.i===o.i;
   if(ok){pilihKiri.b.classList.add("benar");b.classList.add("benar");
    pilihKiri.b.disabled=b.disabled=true;S.jwb.push({benar:true,elemen:m.cp.elemen});selesai++}
   else{b.classList.add("salah");pilihKiri.b.classList.remove("on");
    S.jwb.push({benar:false,elemen:m.cp.elemen});setTimeout(()=>b.classList.remove("salah"),700)}
   pilihKiri=null;
   if(selesai===m.soal.length)setTimeout(()=>buka("hasil",null,true),600)};
  kol.append(b)};
 kiri.forEach(o=>tombol(o,kolomA,"a"));kanan.forEach(o=>tombol(o,kolomB,"b"));
}

function mainIngat(){

 const kartu=acak(m.soal.flatMap((s,i)=>[{t:s.a,i},{t:s.b,i}]));
 let buka1=null,kunci=false,ketemu=0,langkah=0;
 L.innerHTML=`<div class="soal"><h3>Cari pasangannya</h3>
  <p class="mini">Buka dua kartu. Kalau cocok, kartunya tetap terbuka.</p></div>`;
 const info=el("p","mini");L.append(info);
 const g=el("div","kisi");L.append(g);
 kartu.forEach(k=>{
  const b=el("button","kartu-balik",'<span class="belakang">?</span>');
  b.onclick=()=>{
   if(kunci||b.classList.contains("kebuka"))return;
   b.classList.add("kebuka");b.innerHTML=`<span>${esc(k.t)}</span>`;
   if(!buka1){buka1={b,k};return}
   langkah++;kunci=true;
   if(buka1.k.i===k.i){
    b.classList.add("cocok");buka1.b.classList.add("cocok");
    S.jwb.push({benar:true,elemen:m.cp.elemen});ketemu++;buka1=null;kunci=false;
    info.textContent=`${ketemu} dari ${m.soal.length} pasangan ketemu · ${langkah} percobaan`;
    if(ketemu===m.soal.length)setTimeout(()=>buka("hasil",null,true),700);
   }else{
    S.jwb.push({benar:false,elemen:m.cp.elemen});
    const a=buka1;buka1=null;
    setTimeout(()=>{[a.b,b].forEach(x=>{x.classList.remove("kebuka");
     x.innerHTML='<span class="belakang">?</span>'});kunci=false},900);
    info.textContent=`${ketemu} dari ${m.soal.length} pasangan ketemu · ${langkah} percobaan`;
   }};
  g.append(b)});
 info.textContent=`0 dari ${m.soal.length} pasangan ketemu`;
}

LAYAR.hasil=()=>{
 const m=S.misi,j=S.jwb;
 const benar=j.filter(x=>x.benar).length,total=j.length||1;
 const skor=Math.round(benar/total*100);
 const bintang=skor>=90?5:skor>=75?4:skor>=55?3:skor>=35?2:1;
 const menit=Math.max(1,Math.round((Date.now()-S.mulai)/60000));
 const tier=skor>=75?0:skor>=45?1:2;
 const bank=m.fase==='A'?GELAR_A:(GELAR[m.mapel]||GELAR.mtk);
 const gelar=bank[tier];
 const kQ=skor>=75?'tinggi':skor>=45?'sedang':'rendah';
 const quote=QUOTE[kQ][Math.floor(Math.random()*QUOTE[kQ].length)];
 const tierK=skor>=75?"tinggi":skor>=45?"sedang":"rendah";
 const keterangan=KETERANGAN[tierK][Math.floor(Math.random()*KETERANGAN[tierK].length)];
 S.hasil={skor,bintang,benar,total,menit,gelar,quote,keterangan,kode:kodeUnik()};
 if(m.mandiri){
  const mu=Murid.muat();Murid.hadir(mu);
  mu.benar+=benar;mu.salah+=Math.max(0,total-benar);
  mu.xp+=10+Math.round(skor/5);
  mu.riwayat.push({kode:m.kode||m.id||"custom",judul:m.judul,mapel:m.mapel,akt:m.akt,
   skor,tgl:Murid.hariIni()});
  if(mu.riwayat.length>60)mu.riwayat=mu.riwayat.slice(-60);

 const g=S.guru;tajuk.textContent="Paket siap pakai";
 L.innerHTML=`<h2>Paket siap pakai</h2>
  <p class="mini">Soal dan permainannya sudah jadi. Pilih satu, salin pesannya, kirim ke grup WA kelas.</p>`;
 const milikSaya=PAKET.filter(p=>g.m.includes(p.mapel)&&p.fase===g.f);
 const sisanya=PAKET.filter(p=>!milikSaya.includes(p));
 const kartu=p=>{
  const k=el("div","kartu pilih",`<span class="ikon">${AKT[p.akt].i}</span>
   <div><b>${esc(p.judul)}</b><p class="mini">${MAPEL[p.mapel]} · Fase ${p.fase} · ${AKT[p.akt].n}
   · ${p.soal.length?p.soal.length+" soal":"tanpa soal"} · ${p.mode==="pid"?"papan":"rumah"}</p></div>`);

   <p class="mini"><b>Tujuan:</b> ${esc(p.tujuan)}</p>
   <p class="mini"><b>Tema:</b> ${esc(p.tema)} · <b>Dimensi:</b> ${p.dim.join(", ")}</p>
   ${AKT[p.akt].g?`<p class="mini"><b>Peran guru:</b> ${AKT[p.akt].g}</p>`:""}</div>`;
 if(p.soal.length){

 }
 const pakai=el("button","btn emas",p.mode==="pid"?"Pakai sesi ini di papan":"Kirim paket ini ke siswa");

  riwayat=[["guruDash",null]];
  buka(p.mode==="pid"?"papanSiap":"terbit",m)};
 L.append(pakai);

 L.append(sunting);

 D:{
 mtk:[{j:"Pecahan itu pembagian yang belum selesai",d:"3/4 artinya tiga bagian dari empat bagian yang sama besar. Kalau atas dan bawah dikali angka yang sama, nilainya tidak berubah — itulah pecahan senilai."},
  {j:"Aljabar itu berhitung dengan barang yang belum ketahuan",d:"Huruf x cuma nama sementara untuk angka yang belum kita tahu. Kalau x + 7 = 15, berarti x pasti 8. Persamaan itu seperti timbangan: apa pun yang kamu lakukan di kiri, lakukan juga di kanan."},
  {j:"Luas menghitung permukaan, keliling menghitung tepi",d:"Luas persegi panjang = panjang kali lebar. Kelilingnya = dua kali panjang ditambah lebar. Luas pakai satuan persegi, keliling tidak."},
  {j:"Data bercerita kalau disusun",d:"Angka mentah sulit dibaca. Setelah diurutkan dan dibuat diagram, baru terlihat mana yang paling banyak dan mana yang jarang."},
  {j:"Persen itu pecahan dengan penyebut seratus",d:"25% sama saja dengan 25/100 atau 1/4. Diskon 30% berarti dari setiap seratus rupiah, tiga puluh dipotong. Kalau sudah terbiasa, hitung diskon di warung tidak perlu kalkulator."},
  {j:"Perbandingan menjaga bentuk saat ukuran berubah",d:"Resep untuk 4 orang digandakan jadi 8 orang: semua bahan dikali dua, rasanya tetap. Skala peta bekerja dengan cara yang sama."},
  {j:"Pythagoras hanya berlaku pada segitiga siku-siku",d:"Kuadrat sisi miring sama dengan jumlah kuadrat dua sisi lain. Tukang bangunan memakainya untuk memastikan sudut tembok benar-benar siku."},
  {j:"Peluang bukan ramalan",d:"Peluang munculnya angka pada koin adalah 1/2, tapi itu bukan jaminan lima dari sepuluh lemparan pasti angka. Peluang berbicara tentang kecenderungan panjang, bukan hasil berikutnya."}],
 ipa:[{j:"Tumbuhan memasak makanannya sendiri",d:"Daun mengambil karbon dioksida dari udara, akar menyerap air, klorofil menangkap cahaya. Hasilnya glukosa untuk tumbuhan dan oksigen untuk kita."},
  {j:"Perubahan fisika bisa balik, kimia tidak",d:"Es mencair masih air, jadi itu fisika. Kertas dibakar jadi abu dan tidak bisa kembali — itu kimia, karena ada zat baru."},
  {j:"Tubuhmu bekerja tanpa disuruh",d:"Usus halus menyerap sari makanan, alveolus menukar oksigen dengan karbon dioksida, jantung memompa tanpa kamu perintah. Semua berjalan diam-diam."},
  {j:"Percobaan dimulai dari dugaan",d:"Hipotesis adalah dugaan sementara yang harus diuji, bukan tebakan asal. Kalau hasilnya tidak sesuai dugaan, itu tetap temuan yang berharga."},
  {j:"Gaya membuat benda berubah keadaan",d:"Diam jadi bergerak, cepat jadi lambat, lurus jadi berbelok, atau bentuknya berubah. Kalau tidak ada yang berubah, berarti gaya-gaya itu saling meniadakan."},
  {j:"Energi tidak hilang, hanya berganti bentuk",d:"Listrik jadi cahaya di lampu, kimia jadi gerak di tubuhmu, gerak jadi panas saat mengerem. Yang orang sebut energi habis sebenarnya energi berubah jadi bentuk yang tidak lagi berguna."},
  {j:"Rantai makanan dimulai dari yang bisa memasak sendiri",d:"Tumbuhan sebagai produsen, lalu pemakan tumbuhan, lalu pemangsa. Kalau satu mata rantai hilang, seluruh rantainya goyah."},
  {j:"Suhu dan panas itu dua hal berbeda",d:"Suhu menunjukkan derajat panas, sedangkan panas adalah energi yang berpindah. Segelas dan sepanci air bersuhu sama, tapi kandungan panasnya jauh berbeda."},
  {j:"Zat berpindah wujud karena jarak antarpartikel",d:"Padat rapat dan teratur, cair renggang, gas berjauhan. Memanaskan berarti memberi ruang gerak, mendinginkan berarti merapatkan kembali."}],
 ips:[{j:"Peta itu dunia yang dikecilkan",d:"Skala memberi tahu seberapa besar pengecilannya. Skala 1:100.000 berarti 1 cm di peta sama dengan 1 km di dunia nyata. Legenda menjelaskan arti tiap simbol."},
  {j:"Ekonomi berputar dalam tiga langkah",d:"Produksi membuat barang, distribusi mengantarnya, konsumsi memakainya. Petani, sopir truk, dan ibu di dapur adalah tiga mata rantai yang sama."},
  {j:"Harga ditentukan pertemuan dua keinginan",d:"Kalau barang langka tapi banyak yang mau, harga naik. Kalau melimpah dan sedikit peminat, harga turun. Itu sebabnya harga cabai berubah-ubah."},
  {j:"Sejarah dibaca dari sebab dan akibat",d:"Peristiwa tidak muncul sendirian. Selalu ada yang mendahului dan yang mengikuti. Menghafal tanggal tanpa tahu sebabnya membuat sejarah terasa kering."},
  {j:"Indonesia terletak di persimpangan",d:"Diapit dua benua dan dua samudra, dilewati garis khatulistiwa. Letak itu membuat iklimnya tropis, tanahnya subur, dan sejak dahulu menjadi jalur perdagangan dunia."},
  {j:"Kebutuhan bertingkat, keinginan tidak berbatas",d:"Primer harus dipenuhi untuk hidup, sekunder membuat nyaman, tersier menambah gengsi. Masalah ekonomi lahir karena alat pemuas terbatas sedangkan keinginan terus tumbuh."},
  {j:"Interaksi sosial membentuk masyarakat",d:"Kerja sama, persaingan, dan pertentangan semuanya adalah bentuk interaksi. Masyarakat yang sehat bukan yang tanpa perbedaan, melainkan yang tahu cara mengelolanya."},
  {j:"Peninggalan sejarah adalah bukti, bukan dongeng",d:"Prasasti, candi, dan naskah kuno menjadi dasar penulisan sejarah. Tanpa bukti, cerita masa lalu hanya jadi legenda."}],
 ppkn:[{j:"Pancasila bukan hafalan, tapi kebiasaan",d:"Sila ketiga terasa saat kerja bakti tiyuh. Sila keempat terasa saat kelas bermusyawarah. Kalau tidak pernah dipakai, kelima sila itu cuma tulisan di dinding."},
  {j:"Hak dan kewajiban selalu berpasangan",d:"Kamu berhak mendapat kelas yang bersih, sekaligus berkewajiban ikut membersihkannya. Menuntut hak tanpa menjalankan kewajiban membuat aturan pincang."},
  {j:"Norma dibedakan dari sanksinya",d:"Norma agama sanksinya dari Tuhan, norma kesopanan dari masyarakat, norma hukum dari negara. Melanggar lampu merah kena tilang karena itu norma hukum."},
  {j:"Berbeda bukan berarti berlawanan",d:"Bhinneka Tunggal Ika berarti berbeda-beda tetapi tetap satu. Kelasmu jadi kuat justru karena isinya tidak seragam."},
  {j:"Musyawarah bukan sekadar voting",d:"Voting mencari suara terbanyak, musyawarah mencari titik temu. Yang kalah suara tetap perlu didengar alasannya sebelum keputusan diambil."},
  {j:"Keberagaman Indonesia ada angkanya",d:"Lebih dari 1.300 suku bangsa dan ratusan bahasa daerah hidup di satu negara. Tubaba sendiri dihuni pendatang dari berbagai daerah yang kini menyebut diri orang Lampung."},
  {j:"Aturan dibuat untuk melindungi, bukan menyusahkan",d:"Lampu merah menghambat perjalananmu beberapa detik, tetapi menyelamatkan nyawa banyak orang. Aturan yang terasa mengganggu biasanya sedang mencegah sesuatu yang lebih buruk."}],
 pai:[{j:"Akhlak diuji saat tidak ada yang melihat",d:"Jujur ketika sendirian, menahan marah ketika tersinggung, meminta maaf lebih dulu ketika salah. Itu ukuran akhlak yang sebenarnya."},
  {j:"Ibadah punya urutan dan alasannya",d:"Wudu dimulai dari niat dan basmalah, diakhiri membasuh kaki. Urutan itu bukan sekadar aturan, tapi melatih tertib dan kesadaran sebelum menghadap."},
  {j:"Sedekah tidak selalu berupa uang",d:"Senyum kepada saudara adalah sedekah. Menyingkirkan duri dari jalan adalah cabang dari iman. Kebaikan kecil pun punya nilai."},
  {j:"Al-Qur'an dibaca untuk dipahami",d:"Membaca dengan tajwid yang benar itu penting, tetapi berhenti di bacaan saja belum cukup. Kandungannya perlu dibawa ke perbuatan sehari-hari."},
  {j:"Niat membedakan perbuatan yang sama",d:"Dua orang menyapu halaman: satu ingin dipuji, satu ingin membantu. Perbuatannya sama, nilainya berbeda. Karena itu setiap ibadah dimulai dari niat."},
  {j:"Sabar itu aktif, bukan pasrah",d:"Sabar dalam ketaatan, sabar menjauhi larangan, sabar menghadapi musibah. Ketiganya butuh usaha, bukan sekadar diam menunggu."},
  {j:"Ilmu didahulukan sebelum amal",d:"Tanpa tahu tata caranya, ibadah bisa keliru meski niatnya baik. Karena itu menuntut ilmu diwajibkan sejak kecil sampai tua."},
  {j:"Islam datang ke Nusantara lewat perdagangan",d:"Bukan lewat penaklukan, tetapi melalui pedagang, perkawinan, dan pendidikan pesantren. Itu sebabnya budaya lokal banyak yang tetap hidup berdampingan."}],
 pjok:[{j:"Pemanasan itu memberi tahu tubuh",d:"Otot yang dingin lebih mudah cedera. Pemanasan menaikkan suhu otot dan melumasi sendi, supaya tubuh siap sebelum bekerja berat."},
  {j:"Kebugaran punya beberapa sisi",d:"Daya tahan untuk bertahan lama, kekuatan untuk mengangkat, kelenturan untuk menjangkau, kelincahan untuk berpindah arah. Melatih satu saja belum cukup."},
  {j:"Sportivitas dilatih, bukan bawaan",d:"Menerima kekalahan tanpa menyalahkan wasit, menang tanpa mengejek lawan. Itu bagian dari olahraga, sama pentingnya dengan teknik."},
  {j:"Pendinginan sama perlunya",d:"Setelah berlari, jangan langsung duduk diam. Jalan pelan dan peregangan membantu denyut nadi turun bertahap."},
  {j:"Denyut nadi memberi tahu seberapa keras kamu bekerja",d:"Saat istirahat sekitar 60–100 kali per menit. Saat berolahraga naik, lalu turun bertahap saat pendinginan. Kalau tidak turun-turun, itu tanda tubuh perlu istirahat."},
  {j:"Pola makan bagian dari olahraga",d:"Latihan keras dengan makan sembarangan hasilnya sedikit. Karbohidrat untuk tenaga, protein untuk memperbaiki otot, air untuk semuanya."},
  {j:"Permainan tradisional melatih banyak hal sekaligus",d:"Gobak sodor melatih kelincahan dan strategi, egrang melatih keseimbangan, benteng melatih kerja sama. Tidak perlu alat mahal untuk bugar."}],
 informatika:[{j:"Masalah besar dipecah dulu",d:"Dekomposisi berarti membagi masalah jadi bagian kecil yang bisa diselesaikan satu per satu. Resep masakan adalah contoh yang paling dekat."},
  {j:"Algoritma itu urutan yang jelas",d:"Langkah harus berurutan, tidak ambigu, dan pasti berhenti. Kalau ada langkah yang bisa ditafsirkan dua cara, algoritmanya belum benar."},
  {j:"Variabel adalah wadah bernama",d:"Isinya bisa diganti kapan saja, tapi namanya tetap. Perulangan dipakai supaya kita tidak menulis perintah yang sama berkali-kali."},
  {j:"Data pribadi tidak dibagi",d:"Kata sandi, nomor induk, dan alamat rumah bukan bahan obrolan di media sosial. Sekali tersebar, sulit ditarik kembali."},
  {j:"Komputer hanya mengerti dua keadaan",d:"Ada arus dan tidak ada arus, ditulis sebagai 1 dan 0. Semua gambar, lagu, dan tulisan di layarmu pada akhirnya adalah barisan angka itu."},
  {j:"Internet adalah jaringan yang saling menyambung",d:"Datamu dipecah jadi paket kecil, melewati banyak jalur, lalu disusun ulang di tujuan. Itu sebabnya video bisa tersendat kalau satu jalurnya padat."},
  {j:"Jejak digital sulit dihapus",d:"Sekali diunggah, orang lain bisa menyalin dan menyebarkannya. Berpikir sebelum mengunggah jauh lebih mudah daripada menariknya kembali."}],
 senbud:[{j:"Unsur rupa membentuk yang kamu lihat",d:"Garis, bidang, warna, tekstur, gelap terang. Motif tapis Lampung memakai garis zigzag dan warna emas di atas dasar gelap — itu sebabnya terasa mewah."},
  {j:"Irama ada di rupa, musik, dan tari",d:"Pengulangan yang teratur membuat mata dan telinga nyaman. Motif tapis mengulang zigzag, lagu mengulang bait, tari mengulang pola lantai."},
  {j:"Menilai karya butuh alasan",d:"Mengatakan bagus atau jelek saja belum cukup. Sebutkan unsur mana yang membuatmu berkesan, baru penilaianmu punya arti."},
  {j:"Warna punya keluarga",d:"Merah kuning biru adalah warna pokok. Mencampurnya menghasilkan warna kedua. Warna panas terasa dekat dan bersemangat, warna dingin terasa jauh dan tenang."},
  {j:"Lagu daerah menyimpan cara hidup",d:"Lirik lagu Lampung banyak berbicara tentang sungai, sawah, dan adat. Menyanyikannya berarti ikut menjaga ingatan daerah."},
  {j:"Karya tidak harus sempurna untuk berarti",d:"Gambar yang jujur lebih menyentuh daripada gambar rapi yang menirukan orang lain. Yang dinilai adalah gagasan dan kesungguhannya."}],
 prakarya:[{j:"Karya dimulai dari mengamati sekitar",d:"Singkong, bambu, dan pelepah di sekitarmu bisa jadi produk. Yang membedakan bahan biasa dan produk adalah rancangan dan pengerjaan."},
  {j:"Rancang dulu, baru kerjakan",d:"Sketsa dan daftar bahan menghemat waktu dan bahan. Langsung mengerjakan tanpa rencana biasanya berakhir dengan bongkar ulang."},
  {j:"Harga jual dihitung, bukan dikira",d:"Jumlahkan biaya bahan, kemasan, dan tenaga, baru tambahkan keuntungan yang wajar. Menebak harga sering membuat rugi tanpa sadar."},
  {j:"Limbah bisa jadi bahan utama",d:"Pelepah pisang, sabut kelapa, dan botol bekas sudah biasa jadi produk bernilai. Yang membedakan sampah dan bahan hanyalah cara pandang."},
  {j:"Keselamatan kerja bukan formalitas",d:"Pisau tajam justru lebih aman daripada pisau tumpul karena tidak perlu ditekan. Rapikan meja kerja sebelum dan sesudah, itu menghemat waktu dan jari."},
  {j:"Produk laku kalau menjawab kebutuhan",d:"Sebelum membuat, tanyakan siapa yang akan memakainya dan untuk apa. Banyak produk bagus gagal karena tidak ada yang membutuhkannya."}],
 arab:[{j:"Mulai dari kata yang kamu lihat tiap hari",d:"بَيْت rumah, بَاب pintu, كُرْسِيّ kursi. Kosakata benda sekitar paling cepat menempel karena setiap hari terlihat."},
  {j:"Harakat menentukan bunyi",d:"Fathah berbunyi a, kasrah i, dammah u. Huruf yang sama bisa terdengar berbeda hanya karena harakatnya berganti."},
  {j:"Dengar dulu, baru ucap",d:"Bahasa masuk lewat telinga sebelum lidah. Dengarkan berulang, tirukan pelan, baru baca tulisannya."},
  {j:"Huruf berubah bentuk sesuai posisinya",d:"Satu huruf punya bentuk di awal, tengah, akhir, dan berdiri sendiri. Bentuknya berbeda, bunyinya tetap sama."},
  {j:"Angka Arab dibaca dari kiri, tulisan dari kanan",d:"Ini sering membingungkan di awal. Latih dengan menulis tanggal dan nomor rumah dalam bahasa Arab."},
  {j:"Kata kerja punya pelaku yang menempel",d:"Dalam bahasa Arab, siapa yang melakukan sudah tergambar dari bentuk katanya, tanpa perlu menyebut kata ganti terpisah."}],
 literasi:[{j:"Buku punya bagian yang membantu",d:"Daftar isi di depan untuk mencari bab, indeks di belakang untuk mencari kata, glosarium untuk arti istilah sulit. Banyak yang melewatkannya."},
  {j:"Cerita berdiri di atas empat tiang",d:"Tokoh, alur, latar, dan amanat. Kalau salah satunya hilang, cerita terasa timpang."},
  {j:"Jenis buku menentukan cara membaca",d:"Kamus dicari, bukan dibaca dari awal. Novel dinikmati berurutan. Ensiklopedia dibuka sesuai kebutuhan."},
  {j:"Membaca cepat bukan tujuan",d:"Yang penting paham, bukan selesai duluan. Membaca ulang satu paragraf sulit lebih berharga daripada menamatkan sepuluh halaman tanpa mengerti."},
  {j:"Perpustakaan punya susunan yang masuk akal",d:"Buku dikelompokkan menurut subjek, bukan menurut warna sampul. Sekali paham polanya, mencari buku jadi jauh lebih cepat."},
  {j:"Cerita rakyat menyimpan nasihat",d:"Malin Kundang berbicara tentang durhaka, Si Pahit Lidah tentang ucapan yang menyakiti. Nasihatnya dibungkus cerita supaya tidak terasa menggurui."}],
 santai:[{j:"Otak juga perlu pemanasan",d:"Teka-teki ringan sebelum belajar berat membuat pikiran lebih siap. Sama seperti tubuh yang perlu pemanasan sebelum berlari."},
  {j:"Bosan itu tanda, bukan dosa",d:"Kalau kamu bosan, biasanya cara belajarnya yang perlu diganti, bukan kamu yang malas. Coba pindah dari membaca ke bermain, atau sebaliknya."},
  {j:"Peribahasa adalah nasihat yang dipadatkan",d:"Sedikit-sedikit lama-lama menjadi bukit. Satu kalimat pendek menyimpan pelajaran yang butuh satu paragraf untuk dijelaskan."},
  {j:"Lampung punya lebih dari sekadar tapis",d:"Ada gulai taboh, seruit, tari sigeh pengunten, dan aksara Lampung yang disebut Had Lampung. Mengenal daerah sendiri membuat kita tidak asing di rumah sendiri."},
  {j:"Tidur cukup bagian dari belajar",d:"Otak menyusun ulang ingatan saat kamu tidur. Belajar semalaman lalu kurang tidur sering justru membuat yang dihafal cepat menguap."},
  {j:"Kesalahan yang diperbaiki lebih melekat",d:"Jawaban yang sempat salah lalu kamu koreksi biasanya lebih diingat daripada jawaban yang langsung benar. Jadi jangan takut mencoba."}],
 bindo:[{j:"Gagasan pokok biasanya satu kalimat",d:"Kalimat lain di paragraf itu hanya menjelaskannya. Menemukan gagasan pokok membuatmu tidak tenggelam dalam detail."},
  {j:"Menulis itu berpikir dua kali",d:"Sekali saat menyusun, sekali saat membaca ulang. Tulisan yang tidak pernah dibaca ulang biasanya masih berantakan."},
  {j:"Berbicara di depan orang bisa dilatih",d:"Tahu apa yang mau disampaikan, susun tiga poin, lalu bicara pelan. Gugup itu wajar, tidak siap itu yang menyulitkan."}]

 A:{
 bindo:[{j:"Huruf bergabung jadi suku kata",d:"B bertemu A jadi BA. BA bertemu KU jadi BAKU. Bacalah pelan-pelan, jangan buru-buru."},
  {j:"Cerita punya tokoh",d:"Tokoh adalah siapa yang ada di dalam cerita. Coba sebutkan siapa saja yang muncul di cerita tadi."},
  {j:"Menulis dimulai dari menebalkan",d:"Pegang pensil santai, jangan terlalu kencang. Tulis pelan dan rapi lebih baik daripada cepat tapi berantakan."},

const Murid={
 muat(){const m=Simpan.get("murid");
  return m||{nama:"",fase:"D",avatar:"🦊",xp:0,riwayat:[],dibaca:[],lab:0,setor:0,
   streak:0,streakBest:0,hariTerakhir:"",benar:0,salah:0}},
 simpan(m){Simpan.set("murid",m)},
 level(m){return Math.floor(m.xp/LVLSTEP)+1},
 akurasi(m){const t=m.benar+m.salah;return t?Math.round(m.benar/t*100):0},
 hariIni(){return new Date().toISOString().slice(0,10)},
 hadir(m){const h=Murid.hariIni();if(m.hariTerakhir===h)return;
  const kmr=new Date(Date.now()-864e5).toISOString().slice(0,10);
  m.streak=m.hariTerakhir===kmr?(m.streak||0)+1:1;
  m.streakBest=Math.max(m.streakBest||0,m.streak);m.hariTerakhir=h},
 mapelSaya(m){const s={};m.riwayat.forEach(r=>{s[r.mapel]=s[r.mapel]||{n:0,skor:0};
  s[r.mapel].n++;s[r.mapel].skor+=r.skor});
  Object.values(s).forEach(v=>v.rata=Math.round(v.skor/v.n));return s}
};


/* ---- LAYAR KEMAH BELAJAR ---- */
function dock(aktif){
 const m=Murid.muat();
 const menu=m.fase==="A"
  ?[["kemah","🏠","Rumah"],["kemahMain","🎮","Main"],["kemahLembar","⭐","Bintangku"]]
  :[["kemah","🏠","Kemah"],["kemahMateri","📚","Materi"],["kemahMain","🎮","Main"],
    ["kemahLab","🧪","Lab"],["kemahLembar","📝","Lembar"]];
 const d=el("nav","dock");
 menu.forEach(([k,e,n])=>{
  const b=el("button","dock-b"+(k===aktif?" on":""),`<span>${e}</span>${n}`);
  b.onclick=()=>buka(k,null,true);d.append(b)});
 document.body.append(d);
}
function bersihDock(){document.querySelectorAll(".dock").forEach(x=>x.remove())}

function bilahXp(m){
 const lv=Murid.level(m),sisa=m.xp%LVLSTEP;
 return `<div class="xp-baris">
  <div class="ava">${m.avatar}</div>
  <div style="flex:1">
   <div class="xp-atas"><b>${esc(m.nama)}</b><span>Tingkat ${lv}</span></div>
   <div class="xp"><i style="width:${sisa/LVLSTEP*100}%"></i></div>
   <p class="mini">${sisa} dari ${LVLSTEP} poin menuju tingkat ${lv+1}</p>
  </div></div>`;
}

function geser(induk,label,min,max,awal,ubah){
 const d=el("div","geser",`<label>${label}: <b class="nilai">${awal}</b></label>`);
 const i=el("input");i.type="range";i.min=min;i.max=max;i.value=awal;
 i.oninput=()=>{d.querySelector(".nilai").textContent=i.value;ubah(+i.value)};
 d.append(i);induk.append(d);return i;
}
function labTumbuhan(p){
 let cahaya=50,air=50,co2=50;
 const layar=el("div","lab-layar");p.append(layar);
 const gambar=()=>{
  const hasil=Math.round(Math.min(cahaya,air,co2)*0.9);
  const daun=hasil>70?"🌳":hasil>40?"🌿":hasil>15?"🌱":"🥀";
  layar.innerHTML=`<div class="lab-gambar" style="filter:brightness(${0.6+cahaya/180})">
    <span style="font-size:${2.4+hasil/40}rem">${daun}</span>
    <span class="mtr">☀️${cahaya} 💧${air} 🫧${co2}</span></div>
   <div class="lab-hasil"><b>Glukosa terbentuk: ${hasil}</b>
   <p class="mini">${hasil<20?"Ada yang kurang. Fotosintesis butuh ketiganya, bukan salah satu saja."
    :hasil<60?"Sudah jalan, tapi masih bisa lebih baik. Cari mana yang paling rendah."
    :"Bagus! Ketiganya cukup, tumbuhan tumbuh subur."}</p>
   <p class="mini">Oksigen dilepas: ${hasil} · Perhatikan: hasilnya selalu mengikuti bahan yang paling sedikit.</p></div>`};
 geser(p,"☀️ Cahaya matahari",0,100,50,v=>{cahaya=v;gambar()});
 geser(p,"💧 Air dari akar",0,100,50,v=>{air=v;gambar()});
 geser(p,"🫧 Karbon dioksida",0,100,50,v=>{co2=v;gambar()});
 gambar();
 p.append(el("div","pesan","Coba turunkan satu saja sampai nol. Apa yang terjadi? Itulah sebabnya ketiganya disebut bahan yang dibutuhkan."));
}
function labPecahan(p){
 let a=1,b=2,c=1,d=3;
 const layar=el("div","lab-layar");p.append(layar);
 const batang=(x,y,w)=>`<div class="pcn">${Array.from({length:y},(_,i)=>
   `<span class="${i<x?"isi":""}" style="background:${i<x?w:"transparent"}"></span>`).join("")}</div>`;
 const gambar=()=>{
  const n1=a/b,n2=c/d;
  const tanda=Math.abs(n1-n2)<1e-9?"=":n1>n2?">":"<";
  layar.innerHTML=`<div class="pcn-baris"><b>${a}/${b}</b>${batang(a,b,"#2F6FD0")}</div>
   <div class="banding">${tanda}</div>
   <div class="pcn-baris"><b>${c}/${d}</b>${batang(c,d,"#C2591E")}</div>
   <p class="mini">${tanda==="="?"Panjangnya sama persis — ini pecahan senilai.":
     "Bandingkan panjang batangnya, bukan angkanya. Angka penyebut besar belum tentu nilainya besar."}</p>`};
 geser(p,"Pembilang kiri",1,12,1,v=>{a=Math.min(v,b);gambar()});
 geser(p,"Penyebut kiri",1,12,2,v=>{b=Math.max(v,a);gambar()});
 geser(p,"Pembilang kanan",1,12,1,v=>{c=Math.min(v,d);gambar()});
 geser(p,"Penyebut kanan",1,12,3,v=>{d=Math.max(v,c);gambar()});
 gambar();
 p.append(el("div","pesan","Coba buat 1/2 dan 2/4. Batangnya akan sama panjang meski angkanya beda."));
}
function labTimbangan(p){
 let koef=2,tetap=6,hasil=14;
 const layar=el("div","lab-layar");p.append(layar);
 const gambar=()=>{
  const x=(hasil-tetap)/koef;
  const bulat=Number.isInteger(x);
  const miring=Math.max(-9,Math.min(9,(koef*Math.round(x)+tetap-hasil)));
  layar.innerHTML=`<div class="tmb" style="transform:rotate(${miring}deg)">
    <div class="sisi">${koef}x + ${tetap}</div><div class="poros">▲</div><div class="sisi">${hasil}</div></div>
   <div class="lab-hasil"><b>x = ${bulat?x:x.toFixed(2)}</b>
   <p class="mini">Kurangi ${tetap} dari kedua sisi, lalu bagi keduanya dengan ${koef}.
   ${bulat?"Hasilnya bulat, timbangan seimbang.":"Hasilnya pecahan — tidak apa-apa, jawaban tetap sah."}</p></div>`};
 geser(p,"Angka di depan x",1,9,2,v=>{koef=v;gambar()});
 geser(p,"Ditambah berapa",0,20,6,v=>{tetap=v;gambar()});
 geser(p,"Hasilnya berapa",1,60,14,v=>{hasil=v;gambar()});
 gambar();
 p.append(el("div","pesan","Apa pun yang kamu lakukan di sisi kiri, lakukan juga di sisi kanan. Itu satu-satunya aturan."));
}
function labSukuKata(p){
 const suku=["BA","BU","KU","MA","MI","NA","SA","TU","PI","LA","RO","TI","DA","KE","GI"];
 let isi=[];
 const layar=el("div","lab-layar");p.append(layar);
 const kata=el("div","papan-kata");layar.append(kata);
 const rak=el("div","chips");
 const gambar=()=>{kata.textContent=isi.join("")||"— —";
  const jadi=isi.join("");
  layar.querySelector(".ket")?.remove();
  layar.append(el("p","mini ket",jadi.length>=4?`Bacalah pelan-pelan: ${isi.join(" - ")}`:"Ketuk dua atau tiga suku kata di bawah."))};

 p.append(rak);
 const h=el("button","btn garis","Hapus satu");h.onclick=()=>{isi.pop();gambar()};p.append(h);
 gambar();
}
